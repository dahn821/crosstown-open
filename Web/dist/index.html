<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f8"><meta name="description" content="NYC directions with live subway predictions, Citi Bike availability, and connections between them."><title>Crosstown · NYC, connected</title>
<script type="importmap">{"imports":{"leaflet":"./vendor/leaflet/leaflet-src.esm.js","maplibre-gl":"./vendor/maplibre/maplibre-gl.mjs"}}</script><script type="module" async src="location-startup.mjs"></script>
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Crosstown"><link rel="apple-touch-icon" href="app-icon.png"><link rel="stylesheet" href="vendor/leaflet/leaflet.css"><link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="journey.css"></head><body>
<div id="app"><main id="map" aria-label="New York City street map and selected route"></main>
<header class="topbar"><a class="brand" href="#" aria-label="Crosstown home"><span class="brand-icon">↗</span>crosstown</a><span class="city-label">NEW YORK</span></header>
<nav class="utilities" aria-label="App tools"><button class="tool" data-action="transit" aria-label="Live trains and buses"><span data-icon="subway"></span><span>Live transit</span></button><button class="tool" data-action="bikes" aria-label="Nearby Citi Bikes"><span data-icon="bike"></span><span>Nearby bikes</span></button><button class="tool square" data-action="saved" aria-label="Saved trips"><span data-icon="bookmark"></span></button><button class="tool square" data-action="sources" aria-label="Live data sources and connection"><span data-icon="activity"></span><i id="source-light"></i></button></nav>
<section class="planner" aria-label="Plan your trip"><div class="search-card">
<button class="place-row" data-place="origin" aria-label="Change start"><span class="origin-dot"></span><span><small>FROM</small><strong id="origin-label">Current location</strong></span><span class="edit-icon" data-icon="search"></span></button><div class="search-divider"></div><button class="swap" data-action="swap" aria-label="Swap start and destination"><span data-icon="swap"></span></button>
<button class="place-row" data-place="destination" aria-label="Change destination"><span class="destination-dot"></span><span><small>TO</small><strong id="destination-label">Choose a destination</strong></span><span class="edit-icon" data-icon="search"></span></button>
<div class="departure-row"><button data-action="departure"><span data-icon="clock"></span><span id="departure-label">Leave now</span><span class="chevron">⌄</span></button><button class="settings-link" data-action="preferences"><span data-icon="sliders"></span>Make it mine</button></div></div>
<div class="results-card" id="results-card"><button class="sheet-grip" data-action="collapse" aria-label="Expand or collapse routes" aria-expanded="true"><i></i></button>
<div id="route-options" class="route-options">
<div class="results-top"><div><h1>Your connections</h1><p id="results-subtitle">Finding a better way there.</p></div><button class="icon-button sheet-size" data-action="sheet-size" aria-label="Expand route list"><span data-icon="chevron"></span></button><button class="icon-button" data-action="refresh" aria-label="Refresh live routes"><span data-icon="refresh"></span></button></div>
<div class="travel-modes" role="group" aria-label="Compare travel options"><button data-travel-mode="all" class="active" aria-pressed="true">Best</button><button data-travel-mode="subway" aria-pressed="false"><span data-icon="subway"></span>Subway</button><button data-travel-mode="bus" aria-pressed="false"><span data-icon="bus"></span>Bus</button><button data-travel-mode="bike" aria-pressed="false"><span data-icon="bike"></span>Bike</button><button data-travel-mode="walk" aria-pressed="false"><span data-icon="walk"></span>Walk</button></div>
<p class="mode-context" id="mode-context" hidden></p>
<div class="priorities" role="group" aria-label="What matters on this trip"><button data-priority="fastest" class="active" aria-pressed="true"><span data-icon="bolt"></span>Fastest</button><button data-priority="cost" aria-pressed="false"><span data-icon="dollar"></span>Spend less</button><button data-priority="aboveGround" aria-pressed="false"><span data-icon="sun"></span>Above ground</button><button data-priority="sheltered" aria-pressed="false"><span data-icon="umbrella"></span>Less outside</button></div>
<div class="custom-note" id="custom-note" hidden>Your personal mix is active. <button data-action="preferences">Adjust</button></div><div id="route-list" class="route-list" aria-live="polite"><div class="loading"><i></i><strong>Looking for connections</strong><span>Checking streets, trains and bikes.</span></div></div><footer class="results-footer"><span id="freshness"><i class="status-dot"></i>Connecting to live data</span><button data-action="sources">Sources ↗</button></footer></div>
<section id="journey-preview" class="journey-preview" aria-labelledby="journey-title" hidden></section>
<section id="navigation-controls" class="navigation-controls" aria-label="Live navigation controls" hidden>
  <div class="navigation-buttons"><button class="primary" data-action="nav-confirm" hidden></button><button class="primary" data-action="nav-replan" hidden>Find a new route</button><button class="journey-button" data-action="nav-follow" aria-label="Recenter"><span data-icon="locate"></span><span class="recenter-label">Recenter</span></button><button class="journey-button end-navigation" data-action="nav-end">End</button></div>
  <div class="navigation-summary"><div><strong id="navigation-destination"></strong><p id="navigation-progress"></p></div><span id="navigation-signal"></span></div>
</section></div></section>
<section id="navigation-prompt" class="navigation-prompt" aria-label="Next navigation instruction" hidden>
  <div class="navigation-symbol" id="navigation-symbol" aria-hidden="true"></div>
  <div><p id="navigation-distance"></p><h2 id="navigation-instruction" aria-live="polite" tabindex="-1"></h2><p id="navigation-context"></p></div>
</section>
<div class="map-actions"><button class="mobile-map-toggle" data-action="map-view" aria-label="Show route options" aria-pressed="true"><span>Show routes</span></button><button data-action="fit" aria-label="Fit map to route"><span data-icon="locate"></span></button></div><div class="route-map-caption" id="map-caption" hidden></div></div>
<dialog id="sheet" aria-labelledby="sheet-title"></dialog><div id="toast" role="status"></div><script type="module" src="app.mjs"></script></body></html>
